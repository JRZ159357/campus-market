# 文件路径: backend/src/main/resources/application.yml
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-market
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campus_market}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.market.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：secret 长度必须 >= 32 字节（HS256 要求）
jwt:
  secret: campus-market-graduation-project-secret-key-2026
  expire-hours: 168

# 微信小程序配置。mock=true 时不调用真实接口，便于本地无小程序账号时联调
wechat:
  app-id: ${WECHAT_APP_ID:wx0000000000000000}
  app-secret: ${WECHAT_APP_SECRET:00000000000000000000000000000000}
  mock: ${WECHAT_MOCK:true}

# 本地上传目录（相对项目运行目录），通过 /uploads/** 对外访问
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}

# 业务参数
app:
  view-count:
    # 浏览量 Redis 增量回写 MySQL 的间隔（毫秒）。测试环境可传 2000 加快验证
    flush-interval-ms: ${VIEW_FLUSH_INTERVAL_MS:60000}
  order:
    # 待付款保留时长（分钟），超过后由定时任务自动取消
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:30}
    # 超时订单扫描间隔（毫秒），默认 5 分钟
    timeout-scan-ms: ${ORDER_TIMEOUT_SCAN_MS:300000}

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.campus.market: debug
